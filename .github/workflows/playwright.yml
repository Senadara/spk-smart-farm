name: Playwright Tests

on:
  push:
    branches: [main, dev, master, testing]
  pull_request:
    branches: [main, dev, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartfarm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json
          coverage: none

      # Setup Laravel
      - name: Copy Environment File
        run: |
          if [ -f .env.ci ]; then
            cp .env.ci .env
          else
            cp .env.example .env
          fi

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      - name: Run Database Migrations
        run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smartfarm_test
          DB_USERNAME: root
          DB_PASSWORD: root

      # Build Assets
      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: |
          if [ -f "vite.config.js" ] || [ -f "vite.config.ts" ]; then
            npm run build
          fi

      # Start Laravel Server
      - name: Start Laravel Development Server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > server.log 2>&1 &
          sleep 5

      - name: Wait for Laravel Server
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000 | grep -q "Laravel\|<!DOCTYPE"; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      # Setup Node.js for Playwright
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:8000
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
