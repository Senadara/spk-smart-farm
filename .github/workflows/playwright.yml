name: Playwright Tests

on:
  push:
    branches: [main, dev, master, testing]
  pull_request:
    branches: [main, dev, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartfarm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json
          coverage: none

      # Setup Laravel
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      - name: Copy Environment File
        run: |
          if [ -f .env.ci ]; then
            cp .env.ci .env
          else
            cp .env.example .env
          fi

      - name: Generate Application Key
        run: php artisan key:generate

      # Create minimal user table for Playwright test
      - name: Create Required Tables (SQL)
        run: |
          mysql -h 127.0.0.1 -u root -proot smartfarm_test << 'EOF'
          -- User table (required for authentication)
          CREATE TABLE IF NOT EXISTS user (
            id VARCHAR(36) PRIMARY KEY,
            email VARCHAR(255) UNIQUE NOT NULL,
            password VARCHAR(255) NOT NULL,
            name VARCHAR(255) NOT NULL,
            phone VARCHAR(20),
            role ENUM('admin', 'petani', 'petugas') DEFAULT 'petani',
            imageProfile TEXT,
            fcmToken TEXT,
            avatar_url TEXT,
            oAuthStatus TINYINT(1) DEFAULT 0,
            createdAt TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            updatedAt TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          
          -- Sessions table (Laravel requirement)
          CREATE TABLE IF NOT EXISTS sessions (
            id VARCHAR(255) PRIMARY KEY,
            user_id VARCHAR(36),
            ip_address VARCHAR(45),
            user_agent TEXT,
            payload LONGTEXT NOT NULL,
            last_activity INT NOT NULL,
            INDEX sessions_user_id_index (user_id),
            INDEX sessions_last_activity_index (last_activity)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          
          -- Cache table (Laravel requirement)
          CREATE TABLE IF NOT EXISTS cache (
            `key` VARCHAR(255) PRIMARY KEY,
            value MEDIUMTEXT NOT NULL,
            expiration INT NOT NULL
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          
          CREATE TABLE IF NOT EXISTS cache_locks (
            `key` VARCHAR(255) PRIMARY KEY,
            owner VARCHAR(255) NOT NULL,
            expiration INT NOT NULL
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          
          -- Insert test user for Playwright
          INSERT INTO user (id, email, password, name, role, createdAt, updatedAt) 
          VALUES (
            UUID(),
            'petugas@email.com',
            '$2b$10$vI8aWBnW3fIhZV3Ft.KCeOUL/F3qAb7VGMQMwjxlCKZX3Z5bGz5Wm',
            'Petugas Test',
            'petugas',
            NOW(),
            NOW()
          ) ON DUPLICATE KEY UPDATE email=email;
          EOF

      # Skip Laravel migrations (they depend on Node.js API tables)
      # - name: Run Laravel Migrations
      #   run: php artisan migrate --force

      # Skip Laravel seeders (not needed for basic Playwright test)
      # - name: Seed Laravel Data
      #   run: php artisan db:seed --class=DatabaseSeeder --force

      # Build Frontend Assets
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: |
          if [ -f "vite.config.js" ] || [ -f "vite.config.ts" ]; then
            npm run build
          else
            echo "No Vite config found, skipping build"
          fi

      # Start Laravel Server
      - name: Start Laravel Development Server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > server.log 2>&1 &
          echo $! > server.pid
          sleep 5
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_DATABASE: smartfarm_test

      - name: Wait for Laravel Server
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 | grep -q "200\|302"; then
              echo "✅ Server is ready!"
              curl -I http://127.0.0.1:8000
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "❌ Server failed to start after 60s"
          cat server.log
          exit 1

      # Run Playwright Tests
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:8000
          CI: true

      - name: Stop Laravel Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      # Upload Artifacts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload Server Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-logs
          path: server.log
          retention-days: 7
