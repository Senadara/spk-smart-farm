name: Playwright Tests

on:
  push:
    branches: [main, dev, master, testing]
  pull_request:
    branches: [main, dev, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartfarm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Setup Node.js FIRST (for Node.js API migrations)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            smart-farming-api/package-lock.json
            package-lock.json

      # ========================================
      # STEP 1: Node.js API (Sequelize Migrations)
      # ========================================
      - name: Install Node.js API Dependencies
        working-directory: ./smart-farming-api
        run: npm ci

      - name: Create Node.js API .env
        working-directory: ./smart-farming-api
        run: |
          cat > .env << EOF
          DB_HOST=127.0.0.1
          DB_USERNAME=root
          DB_PASSWORD=root
          DB_NAME=smartfarm_test
          DB_TEST_HOST=127.0.0.1
          DB_TEST_USERNAME=root
          DB_TEST_PASSWORD=root
          DB_TEST_NAME=smartfarm_test
          PORT=4000
          BASE_URL=http://localhost:4000/api
          JWT_SECRET=test-secret-key
          JWT_EXPIRED_IN=1d
          JWT_REFRESH_SECRET=test-refresh-secret
          JWT_REFRESH_EXPIRED_IN=86400s
          EOF

      - name: Run Node.js API Migrations (Sequelize)
        working-directory: ./smart-farming-api
        run: npx sequelize-cli db:migrate
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_NAME: smartfarm_test

      - name: Run Node.js API Seeders (Sequelize)
        working-directory: ./smart-farming-api
        run: npx sequelize-cli db:seed:all
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_NAME: smartfarm_test

      # ========================================
      # STEP 2: Laravel App Setup
      # ========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      - name: Copy Environment File
        run: |
          if [ -f .env.ci ]; then
            cp .env.ci .env
          else
            cp .env.example .env
          fi

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Laravel Migrations
        run: php artisan migrate 
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: smartfarm_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Seed Test Data
        run: php artisan db:seed 
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: smartfarm_test
          DB_USERNAME: root
          DB_PASSWORD: root

      # ========================================
      # STEP 3: Build Frontend Assets
      # ========================================
      - name: Install NPM Dependencies (Laravel)
        run: npm ci

      - name: Build Frontend Assets
        run: |
          if [ -f "vite.config.js" ] || [ -f "vite.config.ts" ]; then
            npm run build
          else
            echo "No Vite config found, skipping build"
          fi

      # ========================================
      # STEP 4: Start Laravel Server
      # ========================================
      - name: Start Laravel Development Server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > server.log 2>&1 &
          echo $! > server.pid
          sleep 5
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_DATABASE: smartfarm_test

      - name: Wait for Laravel Server
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 | grep -q "200\|302"; then
              echo "✅ Server is ready!"
              curl -I http://127.0.0.1:8000
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "❌ Server failed to start after 60s"
          cat server.log
          exit 1

      # ========================================
      # STEP 5: Run Playwright Tests
      # ========================================
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:8000
          CI: true

      - name: Stop Laravel Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      # ========================================
      # STEP 6: Upload Artifacts
      # ========================================
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload Server Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-logs
          path: server.log
          retention-days: 7
